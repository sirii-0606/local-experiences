name: ci
on:
  pull_request:
  push:
    branches: [main]

# Backend job (ruff + pytest) lands in M1, frontend job (tsc + build) in M6.
jobs:
  context:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/check_context.py origin/${{ github.base_ref }}
