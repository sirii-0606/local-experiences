[project]
name = "local-experiences"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30", "anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pinned so CI does not drift with ruff defaults
